# Hooks rápidos: si tardan, la gente los desactiva y dejan de proteger nada.
# La suite completa es trabajo del CI, no del commit. Ver §L.5.
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml, -ll]
        additional_dependencies: ["bandit[toml]"]
        files: ^(apps|config)/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: (?x)^(\.venv/.*|db\.sqlite3|.*\.lock)$

  - repo: local
    hooks:
      - id: django-check
        name: django system checks
        entry: python manage.py check
        language: system
        pass_filenames: false
        types: [python]

      - id: django-missing-migrations
        name: no hay modelos sin migración
        entry: python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        types: [python]

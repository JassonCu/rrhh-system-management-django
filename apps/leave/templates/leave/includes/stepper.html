{% comment %}
  Pasos del asistente de solicitud. Recibe `step` (1..3) y `steps` (total).
  El estado del paso no es solo color: el paso actual lleva `aria-current`.
{% endcomment %}
{% load i18n %}
<ol class="stepper">
  <li class="stepper__item stepper__item--{% if step > 1 %}done{% elif step == 1 %}current{% else %}pending{% endif %}"{% if step == 1 %} aria-current="step"{% endif %}>
    <span class="stepper__number" aria-hidden="true">1</span>
    <span>{% translate "Leave type" %}</span>
  </li>
  <li class="stepper__item stepper__item--{% if step > 2 %}done{% elif step == 2 %}current{% else %}pending{% endif %}"{% if step == 2 %} aria-current="step"{% endif %}>
    <span class="stepper__number" aria-hidden="true">2</span>
    <span>{% translate "Dates" %}</span>
  </li>
  <li class="stepper__item stepper__item--{% if step == 3 %}current{% else %}pending{% endif %}"{% if step == 3 %} aria-current="step"{% endif %}>
    <span class="stepper__number" aria-hidden="true">3</span>
    <span>{% translate "Review" %}</span>
  </li>
</ol>

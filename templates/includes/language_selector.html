{% load i18n %}
{% get_current_language as current_language %}
{% get_available_languages as available_languages %}
<form action="{% url 'set_language' %}" method="post" class="language-form">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.path }}">
  <label class="visually-hidden" for="language-select">{% translate "Language" %}</label>
  <select id="language-select" name="language" data-autosubmit="true">
    {% for code, name in available_languages %}
      <option value="{{ code }}" {% if code == current_language %}selected{% endif %}>{{ name }}</option>
    {% endfor %}
  </select>
  <noscript><button type="submit">{% translate "Change" %}</button></noscript>
</form>
